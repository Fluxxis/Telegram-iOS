name: macOS probe

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Runner identity
        run: |
          echo "runner label : ${{ matrix.os }}"
          sw_vers
          uname -m
          echo "cpus   : $(sysctl -n hw.ncpu)"
          echo "memory : $(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 )) GB"
          df -h /

      - name: Installed Xcodes
        run: |
          ls -1 /Applications | grep -i '^Xcode' || echo "no Xcode found"
          echo "--- xcode-select ---"
          xcodebuild -version 2>&1 || true

      - name: Toolchain
        run: |
          python3 --version 2>&1 || true
          /usr/bin/python3 --version 2>&1 || true
          command -v bazel && bazel --version || echo "bazel: not installed"
          /usr/libexec/java_home -V 2>&1 | head -5 || true
